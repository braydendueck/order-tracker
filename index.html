<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data: https:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orders">
<title>Order Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav" id="nav">
 <div class="navrow">
  <div class="navleft"><div class="navtitle" id="navtitle">Orders</div><span id="syncstate" class="syncstate" aria-live="polite"></span></div>
  <div class="pill" id="pill">
    <button id="btnSearch" class="iconbtn" aria-label="Search and filter" title="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button id="btnMenu" class="iconbtn" aria-label="More" aria-haspopup="menu" aria-expanded="false" title="More"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" class="dotf"/><circle cx="12" cy="12" r="1.6" class="dotf"/><circle cx="19" cy="12" r="1.6" class="dotf"/></svg></button>
  </div>
 </div>
 <div id="banner" class="banner" hidden></div>
</header>
<div id="menuwrap" class="menuwrap" hidden><div class="menu" role="menu">
  <button role="menuitem" id="menuAdd" data-act="add"><span>Add order</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button role="menuitem" data-act="togglesearch"><span>Search &amp; filter</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
  <button role="menuitem" id="btnRefresh"><span>Refresh</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button role="menuitem" id="btnSettings"><span>Settings</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</div></div>
<div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>
<main id="main"></main>
<div id="addbar" class="addbar" hidden><button id="btnAdd" class="fab" aria-label="Add order"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div id="page" class="page" hidden></div>
<div id="sheet" class="sheetwrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
